name: Build Ardal Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android-app/**'
      - '.github/workflows/android-build.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 35
        run: |
          SDKMANAGER=/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build stable-signed internal APK
        working-directory: android-app
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ardal-Operations-Native-OCR
          path: android-app/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish latest installable APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="android-native-ocr"
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG"             android-app/app/build/outputs/apk/debug/app-debug.apk#Ardal-Operations-Native-OCR.apk             --title "Ardal Operations Android — Native OCR"             --notes "Internal Android build with stable signing, document scanner and on-device Cyrillic layout OCR."
